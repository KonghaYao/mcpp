name: Release

# 主分支、PR 和手动运行保留验证；仅推送匹配包版本的 v* tag 才发布 npm。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version `bun.lock` was written with: a different Bun
          # can rewrite the lockfile, and `--frozen-lockfile` turns that into a
          # failure rather than a surprise dependency bump.
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: 校验包、版本 tag 和 OIDC 运行环境
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('packages/mcpp/package.json', 'utf8'));
          const number = '(?:0|[1-9]\\d*)';
          const identifier = `(?:${number}|\\d*[A-Za-z-][0-9A-Za-z-]*)`;
          const semver = new RegExp(
            `^${number}\\.${number}\\.${number}(?:-${identifier}(?:\\.${identifier})*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`,
          );
          if (pkg.name !== '@peri-code/mcpp' || pkg.private === true) {
            throw new Error('仅允许发布非 private 的 @peri-code/mcpp');
          }
          if (typeof pkg.version !== 'string' || !semver.test(pkg.version) ||
              process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('版本 tag 必须为 v<package.json 中的合法 SemVer 版本>');
          }

          const [nodeMajor, nodeMinor] = process.versions.node.split('.').map(Number);
          if (nodeMajor < 22 || (nodeMajor === 22 && nodeMinor < 14)) {
            throw new Error('npm OIDC 发布需要 Node.js >= 22.14.0');
          }
          const npmVersion = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = npmVersion.split('.').map(Number);
          if (!/^\d+\.\d+\.\d+$/.test(npmVersion) || major < 11 ||
              (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error('npm OIDC 发布需要 npm >= 11.5.1');
          }

          const distTag = pkg.version.split('+')[0].includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\n`);
          NODE
      - name: 通过 OIDC 发布 npm
        working-directory: packages/mcpp
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish --access public --registry https://registry.npmjs.org --tag "$DIST_TAG"
