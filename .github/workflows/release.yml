name: Verify

# Every push to the default branch, every pull request, and manual runs verify
# the workspace with a frozen dependency install, typecheck and tests. Nothing
# is built, published or deployed here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version `bun.lock` was written with: a different Bun
          # can rewrite the lockfile, and `--frozen-lockfile` turns that into a
          # failure rather than a surprise dependency bump.
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
